server:
  port: ${PORT:8080}
spring:
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE:personal_content}
  data:
    mongodb:
      auto-index-creation: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
        temperature: 0
        max-completion-tokens: 500
    vectorstore:
      mongodb:
        collection-name: content_kb
        index-name: vectorstore_index
        initialize-schema: true
    chat:
      memory:
        repository:
          mongo:
            create-indices: true
  application:
    name: personal-content-rag
agent:
  memory:
    max-messages: 50
calendly:
  access-token: ${CALENDLY_ACCESS_TOKEN:}
  event-type-uri: ${CALENDLY_EVENT_TYPE_URI:}
  scheduling-url: ${CALENDLY_SCHEDULING_URL:https://calendly.com/ricardohsmello/30min}
devrel:
  application:
    track-name: devrel-tutorial-java-content-rag
logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: INFO
